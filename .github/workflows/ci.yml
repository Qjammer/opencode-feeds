name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The oldest Node.js the plugin supports (package.json engines): 22.18 runs TypeScript directly.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - name: npm pack
        run: |
          mkdir dist
          npm pack --pack-destination dist
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/*.tgz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
